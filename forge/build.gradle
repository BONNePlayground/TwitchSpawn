plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
//    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
//        convertAccessWideners = true
//        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "twitchspawn.mixins.json"
        mixinConfig "twitchspawn-forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    shadowBundle "com.squareup.okhttp3:okhttp:$rootProject.okhttp_version"
    shadowBundle "io.socket:socket.io-client:$rootProject.socket_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    forgeRuntimeLibrary "com.squareup.okhttp3:okhttp:$rootProject.okhttp_version"
    forgeRuntimeLibrary "io.socket:socket.io-client:$rootProject.socket_version"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Relocate shaded libraries to avoid conflicts
    relocate 'okhttp3', 'net.programmer.igoodie.twitchspawn.shaded.okhttp3'
    relocate 'okio', 'net.programmer.igoodie.twitchspawn.shaded.okio'
    relocate 'io.socket', 'net.programmer.igoodie.twitchspawn.shaded.socket'
    relocate 'org.json', 'net.programmer.igoodie.twitchspawn.shaded.json'
}

remapJar {
    input.set shadowJar.archiveFile

    archiveBaseName.set("${rootProject.archives_name}-forge-${rootProject.minecraft_version}")
    archiveClassifier.set("")
}
