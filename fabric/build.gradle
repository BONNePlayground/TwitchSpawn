plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        clientDev {
            client()
            programArgs "--username", "Dev"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    implementation "com.electronwill.night-config:core:$rootProject.night_config_version"
    implementation "com.electronwill.night-config:toml:$rootProject.night_config_version"

    shadowBundle "com.electronwill.night-config:core:$rootProject.night_config_version"
    shadowBundle "com.electronwill.night-config:toml:$rootProject.night_config_version"

    shadowBundle "com.squareup.okhttp3:okhttp:$rootProject.okhttp_version"
    shadowBundle "io.socket:socket.io-client:$rootProject.socket_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // Relocate shaded libraries to avoid conflicts
    relocate 'com.electronwill.nightconfig', 'net.programmer.igoodie.twitchspawn.shaded.nightconfig'
    relocate 'okhttp3', 'net.programmer.igoodie.twitchspawn.shaded.okhttp3'
    relocate 'okio', 'net.programmer.igoodie.twitchspawn.shaded.okio'
    relocate 'io.socket', 'net.programmer.igoodie.twitchspawn.shaded.socket'
    relocate 'org.json', 'net.programmer.igoodie.twitchspawn.shaded.json'
}

remapJar {
    input.set shadowJar.archiveFile

    archiveBaseName.set("${rootProject.archives_name}-fabric-${rootProject.minecraft_version}")
    archiveClassifier.set("")
}
